{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Geek — Network{% endblock %}</title>
    <meta name="description" content="Geek — A minimalist social network.">

    <!-- Google Fonts: Syne (display) + IBM Plex Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        noir:     '#0d0d0d',
                        void:     '#111111',
                        deep:     '#161616',
                        surface:  '#1a1a1a',
                        card:     '#1e1e1e',
                        elevated: '#242424',
                        edge:     '#2a2a2a',
                        slate:    '#555555',
                        mid:      '#777777',
                        ash:      '#999999',
                        fog:      '#b0b0b0',
                        bright:   '#d0d0d0',
                        bone:     '#e8e8e8',
                        crimson:  { DEFAULT: '#a33b3b', dim: '#8a2e2e', glow: 'rgba(163,59,59,0.15)' },
                    },
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- Locomotive Scroll CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.css">

    <!-- Custom CSS -->
    <link href="{% static 'network/styles.css' %}?v=3.0" rel="stylesheet">
</head>

<body class="bg-noir text-bright font-display">

    <!-- ========== NAVBAR ========== -->
    <nav id="main-nav" class="fixed top-0 left-0 right-0 z-[999] bg-noir/70 backdrop-blur-2xl">
        <div class="max-w-3xl mx-auto px-6 h-[60px] flex items-center justify-between">
            <!-- Logo — plain white, no gradient -->
            <a href="{% url 'index' %}" class="text-xl font-extrabold tracking-tight text-bone hover:text-white transition-colors">
                Geek
            </a>

            <!-- Nav Links -->
            <div class="flex items-center gap-0.5">
                {% if user.is_authenticated %}
                <a href="{% url 'profile' user_id=user.id %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-ash hover:text-bone hover:bg-white/[0.03] transition-all">
                    <i class="ph ph-user-circle" style="font-size:17px"></i>
                    <span class="font-mono text-xs font-light">{{ user.username }}</span>
                </a>
                {% endif %}

                <a href="{% url 'index' %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-ash hover:text-bone hover:bg-white/[0.03] transition-all">
                    <i class="ph ph-house-simple" style="font-size:17px"></i>
                    <span class="font-light">Feed</span>
                </a>

                {% if user.is_authenticated %}
                <a href="{% url 'following' %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-ash hover:text-bone hover:bg-white/[0.03] transition-all">
                    <i class="ph ph-users" style="font-size:17px"></i>
                    <span class="font-light">Following</span>
                </a>
                <!-- Logout — the ONLY colored element in nav -->
                <a href="{% url 'logout' %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-crimson hover:text-[#d55] hover:bg-crimson-glow transition-all">
                    <i class="ph ph-sign-out" style="font-size:17px"></i>
                    <span class="font-light">Logout</span>
                </a>
                {% else %}
                <a href="{% url 'login' %}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-ash hover:text-bone hover:bg-white/[0.03] transition-all">
                    <i class="ph ph-sign-in" style="font-size:17px"></i>
                    <span class="font-light">Login</span>
                </a>
                <a href="{% url 'register' %}" class="text-xs !py-1.5 !px-4 !rounded-full">
                    Register
                </a>
                {% endif %}
            </div>
        </div>
        <div class="nav-edge-line"></div>
    </nav>

    <!-- ========== SCROLL CONTAINER ========== -->
    <div id="scroll-container" data-scroll-container>
        <main data-scroll-section>
            {% block body %}
            {% endblock %}
        </main>
    </div>

    <!-- ========== LOCOMOTIVE SCROLL JS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>

    <!-- ========== CUSTOM JS ========== -->
    <script src="{% static 'network/script.js' %}?v=3.0"></script>

</body>

</html>
