{% extends "network/layout.html" %}

{% block body %}

<div class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4 py-12">
    <div data-scroll class="glass-panel w-full max-w-md p-8">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber/10 mb-4">
                <i class="ph-duotone ph-user-plus text-amber" style="font-size:28px"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-100">Create Account</h1>
            <p class="text-sm text-muted mt-1">Join the Geek community</p>
        </div>

        <!-- Error message -->
        {% if message %}
            <div class="message-banner mb-5">{{ message }}</div>
        {% endif %}

        <!-- Form -->
        <form action="{% url 'register' %}" method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Username</label>
                <input autofocus class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="text" name="username" placeholder="Choose a username">
            </div>
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Email</label>
                <input class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="email" name="email" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Password</label>
                <input class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="password" name="password" placeholder="Create a password">
            </div>
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Confirm Password</label>
                <input class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="password" name="confirmation" placeholder="Confirm your password">
            </div>
            <button type="submit" class="btn-gradient btn-gradient-amber w-full !py-3 text-base mt-2 !text-white font-semibold rounded-lg border border-white/30 shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                Create Account
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-6 pt-5 border-t border-subtle">
            <p class="text-sm text-muted">
                Already have an account?
                <a href="{% url 'login' %}" class="text-cyan font-medium hover:text-amber transition-colors">Sign in here</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
