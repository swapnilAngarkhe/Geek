{% extends "network/layout.html" %}

{% block body %}

<div class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4 py-12">
    <div data-scroll class="glass-panel w-full max-w-md p-8">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan/10 mb-4">
                <i class="ph-duotone ph-sign-in text-cyan" style="font-size:28px"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-100">Welcome back</h1>
            <p class="text-sm text-muted mt-1">Sign in to your Geek account</p>
        </div>

        <!-- Error message -->
        {% if message %}
            <div class="message-banner mb-5">{{ message }}</div>
        {% endif %}

        <!-- Form -->
        <form action="{% url 'login' %}" method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Username</label>
                <input autofocus class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="text" name="username" placeholder="Enter your username">
            </div>
            <div>
                <label class="block text-xs text-muted font-medium mb-1.5 uppercase tracking-wider">Password</label>
                <input class="input-dark !bg-[rgba(255,255,255,0.04)] !text-gray-100 !border-[rgba(255,255,255,0.06)]" type="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-gradient w-full !py-3 text-base mt-2 !text-white font-semibold rounded-2xl border border-white/20"> 
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-6 pt-5 border-t border-subtle">
            <p class="text-sm text-muted">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-cyan font-medium hover:text-amber transition-colors">Register here</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
